<!doctype html><html><meta charset="utf-8"><title>PipHound transparent presenter</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
img{position:absolute;height:98%;width:auto;bottom:0;left:50%;transform-origin:50% 95%;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateX(-50%) rotate(-1deg) scale(1)}50%{transform:translateX(-50%) rotate(.4deg) scale(1.015)}}
</style><img src="presenter.png" alt="PipHound synthetic presenter"></html>
