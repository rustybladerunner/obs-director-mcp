name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OBS_MCP_PORT: '1'
  OBS_MCP_PASSWORD: not-a-real-secret
  OBS_MCP_ALLOW_OUTPUT_CONTROL: '0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Preserve exact source bytes across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.0'
          architecture: x64
      - name: Install hash-locked wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Scan public source and index
        run: python tools/public_check.py
      - name: Unit and negative-control tests
        run: python -m unittest discover -s tests -v
      - name: Build the release candidate once
        run: python tools/build_release.py
      - name: Inspect exact archive contents and hashes
        run: python tools/verify_dist.py --write-manifest dist/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

  consumer:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        # Final Windows installers for 3.11/3.12; all pins verified in
        # https://github.com/actions/python-versions/blob/main/versions-manifest.json
        python: ['3.11.9', '3.12.10', '3.13.7', '3.14.0']
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source bytes across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist/
      - name: Install hash-locked wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Scan public source and index
        run: python tools/public_check.py
      - name: Unit and negative-control tests
        run: python -m unittest discover -s tests -v
      - name: Verify the downloaded candidate against source and build manifest
        run: python tools/verify_dist.py --check-manifest dist/release-manifest.json
      - name: Install the verified wheel without rebuilding or dependency resolution
        run: python -m pip install --no-deps --no-index dist/*.whl
      - name: Exercise the installed console entry point over MCP with OBS disconnected
        run: python tools/smoke.py --installed
